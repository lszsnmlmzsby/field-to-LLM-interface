# Complete INS-Tracer source; fresh 1x1 vs 2x2 runs share one immutable QA dataset.
model:
  name_or_path: Qwen/Qwen2.5-14B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  gradient_checkpointing: true
data:
  hdf5_env: INS_TRACER_HDF5
  hdf5_path: ${FIELD_TO_LLM_ROOT}/raw/ins_tracer/dedalus_v5.1_Baseline2D_INSTracer_icA_noP_db1_nu0.001D0.01_seed0.hdf5
  require_complete_ins_tracer: true
  fields: [sol/u, sol/v, sol/b]
  patch_size: 16  # Initialization reference only; no resampling of actual fields.
  input_cache_size: 8
  shape_sampling:
    height: [1, 128]
    width: [1, 128]
    seed: 20261013
    heldout_fraction: 0.2
    # Uniform over allowed integer pairs after reserving held-out shapes.
    # Four corners of the domain are also included for each field as boundary checks.
generation:
  seed: 20261013
  split_seed: 20260905
  tasks: [single_point, multi_point, line_profile, region_values, region_mean, region_std, region_min, region_max, region_argmin, region_argmax, nearest_value_location]
  multi_counts: [2, 3, 4]
  line_counts: [2, 3, 4, 5]
  region_shapes: [[1, 1], [1, 2], [2, 1], [2, 2]]
  statistic_region_shapes: [[1, 1], [1, 2], [2, 1], [2, 2], [4, 4]]
  # A 1x1 region is used only when no larger configured region fits.
  template_variants: [0, 1]
  answer_decimals: 1
  absolute_tolerance: 0.2
  max_attempts_per_state: 200
field_encoder:
  normalization:
    mode: zscore
    scope: channel
    stats_path: null
    clip_min: null
    clip_max: null
  model:
    name: conv_token_autoencoder_2d
    input_size: [16, 16]
    base_channels: 32
    channel_multipliers: []
    num_res_blocks: 1
    latent_dim: 8
    latent_grid: [16, 16]
    preserve_input_channels: true
    dropout: 0.0
    norm: group
    activation: gelu
    output_activation: identity
spatial_adapter:
  type: full_grid_transformer
  adapter_dim: 512
  adapter_layers: 2
  adapter_heads: 8
  dropout: 0.0
memory:
  block_shape: [1, 1]
  value_fourier_bands: 4
  value_hidden_dim: 128
cross_attention:
  layers_1based: [8, 20, 32]
  bridge_dim: 512
  heads: 8
  dropout: 0.0
  gate_init: 0.0
training:
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 4
  lr: 5.0e-5
  gate_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_ratio: 0.03
  min_lr_ratio: 0.2
  grad_clip_norm: 1.0
  value_reconstruction_weight: 0.01
  max_prompt_tokens: 384
  max_target_tokens: 96
  log_interval: 20
  save_every_updates: 2048
  eval_every_updates: 8192
evaluation:
  max_new_tokens: 96
  use_cache: true
runtime:
  seed: 42
profiles:
  smoke:
    data:
      qa_dir: ${FIELD_TO_LLM_ROOT}/data/ins_tracer_random_v1/smoke
    generation:
      train_states: 12
      eval_states: 24
    training:
      max_updates: 20
      eval_every_updates: 20
      save_every_updates: 10
  pilot:
    data:
      qa_dir: ${FIELD_TO_LLM_ROOT}/data/ins_tracer_random_v1/pilot
    generation:
      train_states: 1024
      eval_states: 96
    training:
      max_updates: null
      eval_every_updates: 2816
      save_every_updates: 512
  full:
    data:
      qa_dir: ${FIELD_TO_LLM_ROOT}/data/ins_tracer_random_v1/full
    generation:
      train_states: 16384
      eval_states: 512
    training:
      max_updates: null  # Derive from actual applicable QA count; never drop large shapes.
