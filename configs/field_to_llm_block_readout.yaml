# Real-field block-token feasibility. Compare --block-shape 1 1 and 2 2 on ONE dataset.
# This is a separate task protocol; existing multiple-choice runs are unchanged.
model:
  name_or_path: Qwen/Qwen2.5-14B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  gradient_checkpointing: true
data:
  hdf5_path: ${PDEBENCH_HDF5}
  fields: [Vx, Vy, density, pressure]
  patch_size: 16  # Encoder initialization reference; runtime grids remain variable.
  train_shapes: [16x16, 16x32, 32x16, 32x32]
  heldout_shapes: [16x64, 64x16, 17x90, 90x17]
  input_cache_size: 8
generation:
  seed: 20260915
  split_seed: 20260905
  tasks: [single_point, multi_point, line_profile, region_values, region_mean, region_std, region_min, region_max, region_argmin, region_argmax, nearest_value_location]
  multi_counts: [2, 3, 4]
  line_counts: [3, 4, 5]
  region_shapes: [[2, 2]]
  statistic_region_shapes: [[2, 2], [4, 4]]
  template_variants: [0, 1]
  answer_decimals: 1
  absolute_tolerance: 0.2
  max_attempts_per_state: 200
field_encoder:
  normalization:
    mode: zscore
    scope: channel
    stats_path: null
    clip_min: null
    clip_max: null
  model:
    name: conv_token_autoencoder_2d
    input_size: [16, 16]
    base_channels: 32
    channel_multipliers: []
    num_res_blocks: 1
    latent_dim: 8
    latent_grid: [16, 16]
    preserve_input_channels: true
    dropout: 0.0
    norm: group
    activation: gelu
    output_activation: identity
spatial_adapter:
  type: full_grid_transformer
  adapter_dim: 512
  adapter_layers: 2
  adapter_heads: 8
  dropout: 0.0
memory:
  block_shape: [1, 1]
  value_fourier_bands: 4
  value_hidden_dim: 128
cross_attention:
  layers_1based: [8, 20, 32]
  bridge_dim: 512
  heads: 8
  dropout: 0.0
  gate_init: 0.0
training:
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 4
  lr: 5.0e-5
  gate_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_ratio: 0.03
  min_lr_ratio: 0.2
  grad_clip_norm: 1.0
  value_reconstruction_weight: 0.01
  max_prompt_tokens: 384
  max_target_tokens: 96  # Includes EOS; never silently truncate a target.
  log_interval: 20
  save_every_updates: 512
  eval_every_updates: 2816
evaluation:
  max_new_tokens: 96
  use_cache: true
runtime:
  seed: 42
profiles:
  smoke:
    data:
      qa_dir: ${FIELD_TO_LLM_ROOT}/data/block_readout_v1/smoke
      train_shapes: [8x8, 9x17]
      heldout_shapes: []
    generation:
      train_states: 32
      eval_states_per_shape: 4
    training:
      max_updates: 20
      eval_every_updates: 20
      save_every_updates: 10
  pilot:
    data:
      qa_dir: ${FIELD_TO_LLM_ROOT}/data/block_readout_v1/pilot
    generation:
      train_states: 1024
      eval_states_per_shape: 8
    training:
      max_updates: null  # Derive two epochs from the actual selected tasks/batches.
  full:
    data:
      qa_dir: ${FIELD_TO_LLM_ROOT}/data/block_readout_v1/full
    generation:
      train_states: 4096
      eval_states_per_shape: 32
    training:
      max_updates: null
      eval_every_updates: 1024
      save_every_updates: 512

